<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="30" fill="white" font-size="16" font-weight="700">dsh-memory-protocol</text>
  <text x="40" y="50" fill="#94a3b8" font-size="11">DeepSeek Harness 长期记忆插件 — 桥接 opencode-memory MCP 服务器 + 强制记忆协议</text>

  <!-- ===== Main flow layer (LTR) ===== -->
  <!-- 1. dsh host (Primary cyan) -->
  <rect x="40" y="80" width="190" height="70" rx="8" fill="#0f172a"/>
  <rect x="40" y="80" width="190" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135" y="108" fill="white" font-size="12" font-weight="600" text-anchor="middle">dsh</text>
  <text x="135" y="126" fill="#94a3b8" font-size="9" text-anchor="middle">DeepSeek Harness</text>
  <text x="135" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">Web · headless · agent</text>

  <!-- 2. memory-mcp (Connector orange) -->
  <rect x="310" y="80" width="200" height="70" rx="8" fill="#0f172a"/>
  <rect x="310" y="80" width="200" height="70" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="410" y="108" fill="white" font-size="12" font-weight="600" text-anchor="middle">memory-mcp</text>
  <text x="410" y="126" fill="#94a3b8" font-size="9" text-anchor="middle">@deepseek-ai/dsh-mcp-client</text>
  <text x="410" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">MCP 桥接（stdio）</text>

  <!-- 3. memory_skill.mcp_server (Secondary emerald) -->
  <rect x="590" y="70" width="210" height="90" rx="8" fill="#0f172a"/>
  <rect x="590" y="70" width="210" height="90" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="695" y="98" fill="white" font-size="12" font-weight="600" text-anchor="middle">memory_skill</text>
  <text x="695" y="116" fill="#94a3b8" font-size="9" text-anchor="middle">Python MCP server</text>
  <text x="695" y="132" fill="#94a3b8" font-size="9" text-anchor="middle">15 × memory_* 工具</text>
  <text x="695" y="148" fill="#34d399" font-size="8" text-anchor="middle">weave / ingest / search / teach_skill …</text>

  <!-- 4. opencode-memory storage (Tertiary violet, cylinder) -->
  <g transform="translate(860, 80)">
    <rect x="0" y="10" width="160" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="80" cy="10" rx="80" ry="12" fill="#0f172a"/>
    <ellipse cx="80" cy="60" rx="80" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="160" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="80" cy="10" rx="80" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="80" cy="60" rx="80" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="160" y1="10" x2="160" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="80" y="32" fill="white" font-size="11" font-weight="600" text-anchor="middle">opencode-memory</text>
    <text x="80" y="47" fill="#c4b5fd" font-size="8" text-anchor="middle">SQLite + Chroma</text>
  </g>

  <!-- Main-flow arrows -->
  <line x1="230" y1="115" x2="308" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="269" y="107" fill="#94a3b8" font-size="8" text-anchor="middle">tools.execute</text>
  <line x1="510" y1="115" x2="588" y2="115" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="549" y="107" fill="#94a3b8" font-size="8" text-anchor="middle">JSON-RPC</text>
  <line x1="800" y1="115" x2="858" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="829" y="107" fill="#94a3b8" font-size="8" text-anchor="middle">检索 / 写入</text>

  <!-- ===== memory-protocol 强制协议 region ===== -->
  <rect x="40" y="240" width="980" height="250" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="56" y="262" fill="#fbbf24" font-size="11" font-weight="600">memory-protocol — 强制协议（bundle，进程内 hook）</text>

  <!-- hook 1: pre-execute (Alert rose) -->
  <rect x="70" y="290" width="290" height="110" rx="8" fill="#0f172a"/>
  <rect x="70" y="290" width="290" height="110" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="215" y="318" fill="white" font-size="12" font-weight="600" text-anchor="middle">tools/pre-execute</text>
  <text x="215" y="338" fill="#fda4af" font-size="9" text-anchor="middle">未 memory_weave 就调其他工具</text>
  <text x="215" y="356" fill="white" font-size="11" font-weight="700" text-anchor="middle">⛔ DENY（硬门）</text>
  <text x="215" y="376" fill="#94a3b8" font-size="8" text-anchor="middle">"先 weave 记忆，再动工具"</text>
  <text x="215" y="392" fill="#94a3b8" font-size="8" text-anchor="middle">memory_* 工具本身放行</text>

  <!-- hook 2: pre-step (Highlight blue) -->
  <rect x="390" y="290" width="290" height="110" rx="8" fill="#0f172a"/>
  <rect x="390" y="290" width="290" height="110" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="535" y="318" fill="white" font-size="12" font-weight="600" text-anchor="middle">agent/pre-step</text>
  <text x="535" y="338" fill="#93c5fd" font-size="9" text-anchor="middle">每轮自动 memory_weave</text>
  <text x="535" y="356" fill="white" font-size="11" font-weight="700" text-anchor="middle">注入记忆上下文</text>
  <text x="535" y="376" fill="#94a3b8" font-size="8" text-anchor="middle">相关记忆进首条消息</text>
  <text x="535" y="392" fill="#94a3b8" font-size="8" text-anchor="middle">失败 → 门保持关闭（fail-closed）</text>

  <!-- hook 3: turn-stopping (Secondary emerald) -->
  <rect x="710" y="290" width="290" height="110" rx="8" fill="#0f172a"/>
  <rect x="710" y="290" width="290" height="110" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="855" y="318" fill="white" font-size="12" font-weight="600" text-anchor="middle">agent/turn-stopping</text>
  <text x="855" y="338" fill="#6ee7b7" font-size="9" text-anchor="middle">每轮对话自动 memory_ingest</text>
  <text x="855" y="356" fill="white" font-size="11" font-weight="700" text-anchor="middle">自动存档 + 重置门</text>
  <text x="855" y="376" fill="#94a3b8" font-size="8" text-anchor="middle">对话块持久化入库</text>
  <text x="855" y="392" fill="#94a3b8" font-size="8" text-anchor="middle">新一轮重新 weave</text>

  <!-- hooks → memory server dotted arrows -->
  <path d="M 215 290 L 215 240 L 695 240 L 695 162" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="452" y="232" fill="#60a5fa" font-size="8">memory_weave（自动注入）</text>
  <path d="M 855 290 L 855 250 L 760 250 L 760 162" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <text x="806" y="242" fill="#34d399" font-size="8">memory_ingest（自动存档）</text>

  <!-- dsh ↔ protocol in-process link -->
  <line x1="135" y1="150" x2="135" y2="240" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="145" y="200" fill="#fbbf24" font-size="8">进程内注入</text>

  <!-- Legend -->
  <g transform="translate(40, 530)">
    <text x="0" y="12" fill="#94a3b8" font-size="9" font-weight="600">图例</text>
    <rect x="0" y="24" width="14" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="22" y="33" fill="#94a3b8" font-size="9">宿主（前端）</text>
    <rect x="120" y="24" width="14" height="10" rx="2" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
    <text x="142" y="33" fill="#94a3b8" font-size="9">MCP 桥</text>
    <rect x="230" y="24" width="14" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="252" y="33" fill="#94a3b8" font-size="9">后端 / 自动存档</text>
    <rect x="390" y="24" width="14" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="412" y="33" fill="#94a3b8" font-size="9">存储</text>
    <rect x="490" y="24" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
    <text x="512" y="33" fill="#94a3b8" font-size="9">硬门拒绝</text>
    <rect x="600" y="24" width="14" height="10" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
    <text x="622" y="33" fill="#94a3b8" font-size="9">自动注入</text>
  </g>
</svg>
